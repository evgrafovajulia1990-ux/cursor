name: Real site image final additions
on: [push]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified museum photos
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          D=Path("final"); D.mkdir(exist_ok=True)
          sources=json.loads("{\"11\":\"https://upload.wikimedia.org/wikipedia/commons/c/ce/Mari-Zimri_Lim_Palace.jpg\",\"20\":\"https://commons.wikimedia.org/wiki/Special:Redirect/file/Air%20views%20of%20Palestine.%20Various%20points%20of%20interest%20around%20Jerusalem.%20Tell%20el-Ful.%20Indentified%20(i.e.%2C%20identified)%20as%20Gibeah%20of%20Saul.%20I%20Sam.%2010-%2026%20LOC%20matpc.22167.jpg?width=1280\",\"21\":\"https://commons.wikimedia.org/wiki/Special:Redirect/file/Bet%20Shean%20National%20Park%20ruins%20and%20tell.jpg?width=1280\",\"24\":\"https://commons.wikimedia.org/wiki/Special:Redirect/file/Furniture%20Inlays%2C%20Samaria%2C%209th%20Century%20BC%20(28349116227).jpg?width=1280\"}")
          result=[]
          for n,u in sources.items():
           try:
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 (compatible; MuseumResearch/1.0)"})
            with urllib.request.urlopen(req,timeout=25) as r: b=r.read(8000000)
            if not (b[:3]==bytes.fromhex("ffd8ff") or b[:8]==bytes.fromhex("89504e470d0a1a0a")):raise Exception("not an image")
            name=f"{int(n):02d}.jpg" if b[:3]==bytes.fromhex("ffd8ff") else f"{int(n):02d}.png"
            (D/name).write_bytes(b)
            result.append(dict(n=int(n),file=name,url=u))
            print("OK",n,len(b),flush=True)
           except Exception as e: print("FAIL",n,str(e)[:160],flush=True)
          (D/"sources.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-sites-final
          path: final/
          retention-days: 1
