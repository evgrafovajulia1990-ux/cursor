name: Archaeology photo corrections
on:
  push:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected archaeological photographs
        shell: bash
        run: |
          cat > /tmp/correct.py <<'PY'
          import json,os,re,urllib.parse,urllib.request
          from pathlib import Path
          queries=json.loads("{\"2\":\"Ninhursag Sumerian goddess relief Mesopotamian\",\"3\":\"Mesopotamian cylinder seal tree serpent\",\"6\":\"Royal Cemetery of Ur excavation Woolley\",\"9\":\"Etemenanki ruins Babylon\",\"11\":\"Mari palace Tell Hariri archaeological site\",\"13\":\"Nuzi cuneiform tablet legal\",\"14\":\"Bab edh Dhra Jordan Bronze Age\",\"15\":\"Mamre Ramat el Khalil ruins Hebron\",\"16\":\"Tell Balata ancient Shechem\",\"17\":\"Tell el Daba archaeology Avaris\",\"19\":\"Shiloh Khirbet Seilun archaeological site\",\"20\":\"Tell el Ful Gibeah Jerusalem\",\"21\":\"Tel Beth Shean archaeological ruins\",\"22\":\"Warren's Shaft Jerusalem water system\",\"23\":\"Megiddo ancient stables archaeology\",\"24\":\"Samaria ivory archaeological inlays\",\"34\":\"Gedaliah seal bulla archaeology\"}")
          exact=json.loads("{\"18\":\"jericho-excavation.jpg\",\"25\":\"mesha-stele.jpg\",\"26\":\"black-obelisk-jehu.jpg\",\"31\":\"bubastite-portal.jpg\",\"32\":\"siloam-inscription.jpg\",\"36\":\"cyrus-cylinder.jpg\"}")
          D=Path('corrections');D.mkdir(exist_ok=True)
          def get(url):
            return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MuseumBibleResearch/1.0 research'},),timeout=45)
          rows=[]
          def photo(n,title,url,page,origin):
            with get(url) as r:body=r.read(9000000)
            if len(body)<15000 or body[:3]!=b'\xff\xd8\xff' and body[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError('not image')
            ext='.jpg' if body[:3]==b'\xff\xd8\xff' else '.png'
            (D/(f'{n:02d}'+ext)).write_bytes(body)
            return dict(n=n,filename=f'{n:02d}'+ext,title=title,url=url,source_page=page,bytes=len(body),origin=origin)
          for key,q in queries.items():
            n=int(key);found=None
            terms=[q, q.replace(' archaeology',''),q.split(' ')[0]+' archaeology']
            for term in terms:
              params={'action':'query','generator':'search','gsrsearch':term,'gsrnamespace':6,'gsrlimit':35,'prop':'imageinfo','iiprop':'url|size','iiurlwidth':1200,'format':'json','formatversion':2}
              try:
                with get('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)) as r:dat=json.load(r)
                pages=sorted(dat.get('query',{}).get('pages',[]),key=lambda p:p.get('index',99))
                for p in pages:
                  title=p.get('title','')
                  if not re.search(r'\.(jpg|jpeg|png)$',title,re.I):continue
                  if any(x in title.lower() for x in ['history of','the book','quarterly','text book','album','sketch','diagram','schematic','plan ', 'map ','flag of']):continue
                  ii=(p.get('imageinfo') or [{}])[0]
                  if ii.get('width',0)<450 or ii.get('height',0)<300:continue
                  u=ii.get('thumburl') or ii.get('url')
                  if not u:continue
                  try:
                    found=photo(n,title,u,ii.get('descriptionurl',''),'Wikimedia Commons');break
                  except Exception:pass
                if found:break
              except Exception as e:print(n,str(e)[:90],flush=True)
            if found: rows.append(found);print('OK',n,found['title'],flush=True)
            else:print('MISS',n,q,flush=True)
          for key,name in exact.items():
            n=int(key)
            u='https://raw.githubusercontent.com/ding0t/bible_studies/main/docs/content/assets/img/archaeology/'+name
            try:
              row=photo(n,name,u,'https://github.com/ding0t/bible_studies/blob/main/docs/content/assets/img/archaeology/'+name,'verified archived image');rows.append(row);print('EXACT',n,flush=True)
            except Exception as e:print('EXACT MISS',n,e,flush=True)
          (D/'sources.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
          python /tmp/correct.py
      - uses: actions/upload-artifact@v4
        with:
          name: archaeology-corrected
          path: corrections/
          retention-days: 1
